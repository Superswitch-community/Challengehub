<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./images/large.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Login - Best Brain Tutorial</title>
</head>

<body class="min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-green-700 text-white p-4 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="./index.html" class="flex items-center space-x-2">
        <img src="./images/large.png" alt="Logo" class="w-12 h-12 rounded-full" />
        <span class="font-bold text-xl">BBT</span>
      </a>
      <div class="hidden md:flex space-x-4 items-center">
        <a href="./index.html" class="hover:text-green-300">Home</a>
        <a href="./register.html" class="hover:text-green-300">Register</a>
        <a href="./login.html" class="hover:text-green-300 font-semibold">Login</a>
      </div>
      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button id="mobile-menu-button" class="focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden flex-col px-4 mt-2 space-y-2 md:hidden">
      <a href="./index.html" class="block hover:text-green-300">Home</a>
      <a href="./register.html" class="block hover:text-green-300">Register</a>
      <a href="./login.html" class="block hover:text-green-300 font-semibold">Login</a>
    </div>
  </nav>

  <!-- Hero / Login Section -->
  <div class="flex-1 relative bg-cover bg-center" style="background-image: url('https://images.pexels.com/photos/4145038/pexels-photo-4145038.jpeg');">
    <div class="absolute inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4">
      <div class="bg-white bg-opacity-90 backdrop-blur-md p-8 rounded-lg max-w-md w-full shadow-lg">
        <h2 class="text-2xl font-bold text-green-700 text-center mb-6">Login to Best Brain Tutorial</h2>

        <form id="login-form" class="space-y-4">
          <div>
            <label for="login-email" class="block text-gray-700 font-medium mb-1">Email</label>
            <input type="email" id="login-email" required
              class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>

          <div>
            <label for="login-password" class="block text-gray-700 font-medium mb-1">Password</label>
            <input type="password" id="login-password" required
              class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>

          <div>
            <label for="login-category" class="block text-gray-700 font-medium mb-1">Category</label>
            <select id="login-category" required
              class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
              <option value="">Select Category</option>
              <option value="primary">Primary</option>
              <option value="junior">Junior</option>
              <option value="senior-science">Senior Science</option>
              <option value="senior-art">Senior Art</option>
            </select>
          </div>

          <button type="submit"
            class="w-full bg-green-700 text-white py-2 rounded hover:bg-green-800 transition-colors">Login</button>
        </form>

        <p class="mt-4 text-center text-gray-700">
          Don't have an account? <a href="./register.html" class="text-green-700 font-semibold hover:underline">Register</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Mobile menu toggle
    const btn = document.getElementById('mobile-menu-button');
    const menu = document.getElementById('mobile-menu');
    btn.addEventListener('click', () => {
      menu.classList.toggle('hidden');
    });
  </script>

</body>

</html>
